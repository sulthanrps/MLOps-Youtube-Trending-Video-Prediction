name: yt-trending-mlops

services:
  mlflow-db:
    image: postgres:16-alpine
    container_name: mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow-server:
    build: ./docker/mlflow
    image: yt-trending/mlflow-server:2.22.5
    container_name: mlflow-server
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@mlflow-db:5432/${POSTGRES_DB:-mlflow}
      --serve-artifacts
      --artifacts-destination /mlartifacts
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "5000:5000"
    networks:
      - mlops-net
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  model-seeder:
    build: ./docker/mlflow
    image: yt-trending/mlflow-server:2.22.5
    container_name: model-seeder
    restart: "no"
    command: ["python", "/app/seed_registry.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_NAME: youtube-trending-24h-classifier
      SEED_MODEL_DIR: /seed/production
    volumes:
      - ./models/production:/seed/production:ro
      - ./scripts/seed_registry.py:/app/seed_registry.py:ro
    networks:
      - mlops-net
    depends_on:
      mlflow-server:
        condition: service_healthy

  api-service:
    build: .
    image: youtube-trending-api:compose
    container_name: api-service
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_URI: models:/youtube-trending-24h-classifier@champion
    ports:
      - "8000:8000"
    networks:
      - mlops-net
    depends_on:
      mlflow-server:
        condition: service_healthy
      model-seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  model-serving:
    image: youtube-trending-mlflow-serve:latest
    pull_policy: never
    expose:
      - "8080"
    entrypoint: ["mlflow", "models", "serve"]
    command: ["-m", "/opt/ml/model", "-h", "0.0.0.0", "-p", "8080", "--env-manager", "local", "--workers", "1"]
    networks:
      - mlops-net
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  model-lb:
    image: nginx:1.27-alpine
    container_name: model-lb
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    networks:
      - mlops-net
    depends_on:
      model-serving:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mlops-net:
    name: mlops-net
    driver: bridge

volumes:
  mlflow-db-data:
    name: mlflow-db-data
  mlflow-artifacts:
    name: mlflow-artifacts