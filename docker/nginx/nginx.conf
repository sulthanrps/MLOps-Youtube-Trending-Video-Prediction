events {}

http {
    upstream mlflow_model {
        server model-serving:8080;
    }

    log_format upstream '$remote_addr -> $upstream_addr "$request" $status ${request_time}s';
    access_log /dev/stdout upstream;

    server {
        listen 80;

        location = /lb-health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://mlflow_model;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503;
            # Menandai replika yang menjawab request
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}