name: Data Ingestion & Preprocessing Pipeline

on:
  schedule:
    # GitHub Actions menggunakan zona waktu UTC, sedangkan saya berada di zona waktu WIB = UTC+7.
    # Sehingga perlu penyesuain schedule pada cron job seperti dibawah ini : 
    # 17:00 UTC = 00:00 WIB, 23:00 UTC = 06:00 WIB, 05:00 UTC = 12:00 WIB, 11:00 UTC = 18:00 WIB
    - cron: '0 5,11,17,23 * * *'
  
  # Trigger manual agar bisa dites kapan saja tanpa menunggu jadwal cron
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests python-dotenv

      - name: Run Data Ingestion
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/data/ingestion.py

      - name: Run Feature Engineering
        run: python src/features/build_features.py